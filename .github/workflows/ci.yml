name: InfraPilot CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: infrapilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform Configuration
        working-directory: infrastructure/terraform/demo
        run: |
          terraform init -backend=false
          terraform validate

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Setup Database & Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5432/infrapilot?schema=public
        run: |
          npx prisma db push
          npm run db:seed

      - name: Run Backend TypeScript Checks & Build
        working-directory: backend
        run: npm run build

      - name: Run Backend Automated Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5432/infrapilot?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_secret_key_12345
          NODE_ENV: test
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend TypeScript Check & Production Build
        working-directory: frontend
        run: npm run build
